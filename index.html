    <title>Project:Tic-Tac-Toe</title>

    <div class="tiles" id="tile3" role="button"></div>
    <div class="tiles" id="tile4" role="button"></div>
    <div class="tiles" id="tile5" role="button"></div>
    <div class="tiles" id="tile6" role="button"></div>
    <div class="tiles" id="tile7" role="button"></div>
    <div class="tiles" id="tile8" role="button"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
